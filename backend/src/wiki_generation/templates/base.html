<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>{% block title %}RepoAtlas Wiki{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container-low": "#f3f3f4",
              "tertiary-fixed": "#c9e6ff",
              "on-secondary": "#ffffff",
              "surface-variant": "#e2e2e2",
              "secondary-fixed-dim": "#b7c8e1",
              "on-tertiary-fixed-variant": "#004c6e",
              "surface-tint": "#0053db",
              "primary-container": "#2563eb",
              "on-tertiary": "#ffffff",
              "on-surface-variant": "#434655",
              "surface-subtle": "#f8fafc",
              "surface-container-highest": "#e2e2e2",
              "on-primary-container": "#eeefff",
              "error-container": "#ffdad6",
              "on-secondary-fixed": "#0b1c30",
              "surface-container-lowest": "#ffffff",
              "primary-fixed": "#dbe1ff",
              "on-primary-fixed": "#00174b",
              "on-secondary-container": "#54647a",
              "tertiary-container": "#0074a6",
              "surface-bright": "#f9f9f9",
              "on-error-container": "#93000a",
              "surface-container": "#eeeeee",
              "secondary": "#505f76",
              "on-primary": "#ffffff",
              "primary-fixed-dim": "#b4c5ff",
              "inverse-primary": "#b4c5ff",
              "error": "#ba1a1a",
              "tertiary": "#005a82",
              "on-error": "#ffffff",
              "surface": "#f9f9f9",
              "on-secondary-fixed-variant": "#38485d",
              "surface-container-high": "#e8e8e8",
              "on-background": "#1a1c1c",
              "secondary-fixed": "#d3e4fe",
              "text-secondary": "#475569",
              "text-primary": "#0f172a",
              "on-surface": "#1a1c1c",
              "on-tertiary-fixed": "#001e2f",
              "on-tertiary-container": "#e4f2ff",
              "surface-border": "#e2e8f0",
              "inverse-surface": "#2f3131",
              "secondary-container": "#d0e1fb",
              "inverse-on-surface": "#f0f1f1",
              "background": "#f9f9f9",
              "outline-variant": "#c3c6d7",
              "outline": "#737686",
              "primary": "#004ac6",
              "tertiary-fixed-dim": "#89ceff",
              "on-primary-fixed-variant": "#003ea8",
              "surface-dim": "#dadada"
            },
            borderRadius: {
              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "full": "9999px"
            },
            spacing: {
              "base": "4px",
              "xs": "4px",
              "sm": "8px",
              "lg": "24px",
              "max-content-width": "1280px",
              "xl": "32px",
              "md": "16px",
              "xxl": "48px",
              "sidebar-width": "280px",
              "container-max": "1200px"
            },
            fontFamily: {
              "display-lg": ["Inter", "sans-serif"],
              "body-md": ["Inter", "sans-serif"],
              "body-sm": ["Inter", "sans-serif"],
              "body-lg": ["Inter", "sans-serif"],
              "label-md": ["Inter", "sans-serif"],
              "headline-md": ["Inter", "sans-serif"],
              "headline-sm": ["Inter", "sans-serif"],
              "code-md": ["JetBrains Mono", "monospace"]
            }
          }
        }
      }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex">
    <!-- SideNavBar -->
    <aside class="hidden md:flex bg-surface-container-lowest text-on-surface w-[280px] h-screen fixed left-0 top-0 overflow-y-auto border-r border-outline-variant shadow-sm flex-col py-xl z-50">
        <div class="px-lg mb-xl">
            <h1 class="font-display-lg text-2xl font-bold text-primary mb-xs">
                <a href="#" onclick="window.location.href = window.location.pathname.includes('/symbols/') ? '../index.html' : 'index.html'; return false;">RepoAtlas</a>
            </h1>
            <p class="text-on-surface-variant text-sm">Documentation</p>
        </div>
        
        <!-- Search Bar Container -->
        <div class="px-lg mb-lg">
            <div class="relative group">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary text-sm">search</span>
                <input type="text" id="searchInput" class="w-full bg-surface-container-low text-on-surface rounded-full py-sm pl-10 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-primary border-none transition-all placeholder:text-outline-variant" placeholder="Search files, symbols...">
                <div id="searchResults" class="hidden absolute top-11 left-0 right-0 bg-surface-container-lowest border border-outline-variant rounded-xl max-h-80 overflow-y-auto z-50 shadow-lg"></div>
            </div>
        </div>

        <nav class="flex-1 flex flex-col gap-xs pr-md">
            <a id="nav-overview" class="nav-item flex items-center gap-md text-on-surface-variant px-lg py-sm hover:bg-surface-container transition-colors rounded-r-full scale-98 active:scale-95 duration-150" href="#" onclick="window.location.href = window.location.pathname.includes('/symbols/') ? '../index.html' : 'index.html'; return false;">
                <span class="material-symbols-outlined text-primary">analytics</span>
                Project Overview
            </a>
            <a id="nav-tech" class="nav-item flex items-center gap-md text-on-surface-variant px-lg py-sm hover:bg-surface-container transition-colors rounded-r-full scale-98 active:scale-95 duration-150" href="#" onclick="window.location.href = window.location.pathname.includes('/symbols/') ? '../tech.html' : 'tech.html'; return false;">
                <span class="material-symbols-outlined text-primary">layers</span>
                Tech Stack
            </a>
            <a id="nav-architecture" class="nav-item flex items-center gap-md text-on-surface-variant px-lg py-sm hover:bg-surface-container transition-colors rounded-r-full scale-98 active:scale-95 duration-150" href="#" onclick="window.location.href = window.location.pathname.includes('/symbols/') ? '../architecture.html' : 'architecture.html'; return false;">
                <span class="material-symbols-outlined text-primary">account_tree</span>
                Architecture
            </a>
            <a id="nav-modules" class="nav-item flex items-center gap-md text-on-surface-variant px-lg py-sm hover:bg-surface-container transition-colors rounded-r-full scale-98 active:scale-95 duration-150" href="#" onclick="window.location.href = window.location.pathname.includes('/symbols/') ? '../modules.html' : 'modules.html'; return false;">
                <span class="material-symbols-outlined text-primary">view_module</span>
                Modules
            </a>
            <a id="nav-tests" class="nav-item flex items-center gap-md text-on-surface-variant px-lg py-sm hover:bg-surface-container transition-colors rounded-r-full scale-98 active:scale-95 duration-150" href="#" onclick="window.location.href = window.location.pathname.includes('/symbols/') ? '../tests.html' : 'tests.html'; return false;">
                <span class="material-symbols-outlined text-primary">terminal</span>
                Tests
            </a>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="ml-0 md:ml-[280px] flex-1 min-h-screen flex flex-col w-full">
        <!-- TopNavBar -->
        <header class="bg-surface-container-lowest text-on-surface font-label-md flex justify-between items-center px-lg h-16 w-full sticky top-0 z-40 border-b border-outline-variant bg-opacity-90 backdrop-blur-sm">
            <div class="flex items-center gap-md">
                <nav class="flex gap-sm items-center text-sm text-on-surface-variant">
                    <a class="hover:text-primary transition-colors font-medium" href="#" onclick="window.location.href = window.location.pathname.includes('/symbols/') ? '../index.html' : 'index.html'; return false;">Home</a>
                    <span class="material-symbols-outlined text-[16px]">chevron_right</span>
                    <span class="text-primary font-semibold">{% block breadcrumb %}Page{% endblock %}</span>
                </nav>
            </div>
        </header>

        <!-- Page Content Wrapper -->
        <div class="flex-1 max-w-[1200px] mx-auto w-full p-md md:p-xl">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Search & Active Nav Script -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Live Search
            const searchInput = document.getElementById("searchInput");
            const searchResults = document.getElementById("searchResults");
            let searchIndex = [];

            const isSymbolPage = window.location.pathname.includes('/symbols/');
            const indexPath = isSymbolPage ? '../search_index.json' : 'search_index.json';

            fetch(indexPath)
                .then(response => response.json())
                .then(data => searchIndex = data)
                .catch(err => console.error("Could not load search_index.json", err));

            if (searchInput && searchResults) {
                searchInput.addEventListener("input", function() {
                    const query = this.value.toLowerCase().trim();
                    searchResults.innerHTML = "";
                    
                    if (!query) {
                        searchResults.classList.add("hidden");
                        return;
                    }

                    const results = searchIndex.filter(item => item.name.toLowerCase().includes(query)).slice(0, 15);
                    
                    if (results.length > 0) {
                        results.forEach(item => {
                            const a = document.createElement("a");
                            a.href = isSymbolPage ? (item.url.startsWith('symbols/') ? '../' + item.url : '../' + item.url) : item.url;
                            a.textContent = item.name;
                            a.className = "block px-4 py-2 text-xs text-on-surface hover:bg-surface-container border-b border-surface-variant last:border-0 transition-colors";
                            searchResults.appendChild(a);
                        });
                        searchResults.classList.remove("hidden");
                    } else {
                        const noResult = document.createElement("div");
                        noResult.textContent = "No results found";
                        noResult.className = "px-4 py-2 text-xs text-outline";
                        searchResults.appendChild(noResult);
                        searchResults.classList.remove("hidden");
                    }
                });

                document.addEventListener("click", function(e) {
                    if (e.target !== searchInput && !searchResults.contains(e.target)) {
                        searchResults.classList.add("hidden");
                    }
                });
            }

            // Highlight Active Sidebar Item
            const path = window.location.pathname;
            let activeId = "nav-overview";
            if (path.includes("tech.html")) activeId = "nav-tech";
            else if (path.includes("architecture.html")) activeId = "nav-architecture";
            else if (path.includes("modules.html")) activeId = "nav-modules";
            else if (path.includes("tests.html")) activeId = "nav-tests";
            
            const activeElem = document.getElementById(activeId);
            if (activeElem) {
                activeElem.className = "nav-item flex items-center gap-md bg-secondary-container text-primary border-l-4 border-primary px-lg py-sm rounded-r-full font-semibold scale-98 active:scale-95 duration-150";
            }
        });
    </script>
</body>
</html>
