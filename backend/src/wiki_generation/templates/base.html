<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RepoAtlas Wiki{% endblock %}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; display: flex; color: #333; }
        .sidebar { width: 250px; background-color: #f4f5f7; padding: 20px; height: 100vh; border-right: 1px solid #e1e4e8; position: fixed; overflow-y: auto; }
        .sidebar a { display: block; padding: 8px 0; color: #0366d6; text-decoration: none; }
        .sidebar a:hover { text-decoration: underline; }
        .main-content { margin-left: 290px; padding: 40px; max-width: 800px; width: 100%; }
        .search-bar { width: 100%; padding: 8px; margin-bottom: 20px; box-sizing: border-box; }
        .fact-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .fact-table th, .fact-table td { border: 1px solid #dfe2e5; padding: 10px; text-align: left; }
        .fact-table th { background-color: #f6f8fa; width: 30%; }
        .breadcrumb { font-size: 0.9em; color: #586069; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>RepoAtlas</h3>
        <input type="text" class="search-bar" placeholder="Search...">
        <strong>Documentation</strong>
        <a href="tech.html">Technology Stack</a>
        <a href="architecture.html">Architecture</a>
        <a href="modules.html">Modules</a>
        <a href="tests.html">Tests</a>
    </div>
    
    <div class="main-content">
        <div class="breadcrumb">
            Home / {% block breadcrumb %}Page{% endblock %}
        </div>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
