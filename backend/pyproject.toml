[project]
name = "repoatlas-backend"
version = "0.1.0"
description = "RepoAtlas backend — indexing, knowledge graph, and AI analysis engines"
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "pydantic>=2.0",
    "pathspec>=0.11",
    "httpx>=0.27",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: tests requiring a running Ollama server and a pulled model (deselect with '-m \"not live\"')",
]
