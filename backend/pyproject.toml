[project]
name = "repoatlas-ai-analysis"
version = "0.1.0"
description = "Hierarchical AST chunking and local SLM analysis engine for RepoAtlas (Epic 3)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: tests requiring a running Ollama server and a pulled model (deselect with '-m \"not live\"')",
]
